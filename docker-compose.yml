services:
  ml-api:
    build: ./ml_service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOCAL_DEMO_MODE: "true"
      FAKE_NEWS_INTEGRATION_MODE: live
      FAKE_NEWS_API_BASE_URL: http://ml-api:8000
      PORT: "3000"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev"
    ports:
      - "3000:3000"
    depends_on:
      ml-api:
        condition: service_healthy

volumes:
  dashboard_node_modules:

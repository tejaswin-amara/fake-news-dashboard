name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ml_service/requirements.txt
      - run: python -m py_compile ml_service/app.py
      - run: |
          nohup uvicorn ml_service.app:app --host 127.0.0.1 --port 8000 >/tmp/ml.log 2>&1 &
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  print(urllib.request.urlopen('http://127.0.0.1:8000/ready').read().decode())
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit(open('/tmp/ml.log').read())
          req = urllib.request.Request('http://127.0.0.1:8000/predict', data=json.dumps({'title':'Official announcement','text':'The ministry published an official statement today.'}).encode(), headers={'Content-Type':'application/json'})
          result = json.loads(urllib.request.urlopen(req).read())
          assert result['label_name'] in {'real','fake'}
          assert 0 <= result['probability_fake'] <= 1
          print(result)
          PY
